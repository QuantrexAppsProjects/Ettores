<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url='./ettores-redesign4.html'">
    <title>Ettore's Bakery & Café</title>
    <meta name="description" content="Ettore's redesign landing page">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0a08;
        --ink: #f3ece2;
        --muted: #bdb0a0;
        --accent: #c9a45a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .card {
        max-width: 42rem;
        text-align: center;
        border: 1px solid rgba(201,164,90,0.35);
        background: rgba(26,21,18,0.9);
        padding: 2rem 2.5rem;
        box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      }
      h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin: 0 0 1rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Ettore's redesign</h1>
      <p>Loading the redesign page… If it does not redirect automatically, <a href="./ettores-redesign4.html">open the page here</a>.</p>
    </main>
  </body>
</html>
